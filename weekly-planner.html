<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html{color-scheme:light dark}body{margin:0;font-size:14px}</style>
<title>مخطط الأسبوع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: sticky toolbar over a "desk"; below it one A4-landscape paper sheet that is edited in place. */
:root{
  --desk:#e6e9ee; --bar:#f7f8fa; --line:#cdd3dc; --text:#1c2430; --muted:#5d6878;
  --accent:#1f4e8c; --accent-fg:#ffffff; --danger:#a8321f;
  --paper:#ffffff; --ink:#111111; --rule-soft:#9aa0a8;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#14171c; --bar:#1d2128; --line:#333a45; --text:#e6e9ee; --muted:#9aa4b2;
    --accent:#7fb0ff; --accent-fg:#0d1b2e; --danger:#ff8d78; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#14171c; --bar:#1d2128; --line:#333a45; --text:#e6e9ee; --muted:#9aa4b2;
  --accent:#7fb0ff; --accent-fg:#0d1b2e; --danger:#ff8d78; color-scheme:dark;
}
body{background:var(--desk);color:var(--text);font-family:var(--font);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
*{box-sizing:border-box}
#app{min-height:100vh}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.sep{width:1px;height:24px;background:var(--line);margin-inline:4px}
.brand{font-weight:700;font-size:16px;margin-inline-end:8px}
button,input{font-family:var(--font);font-size:14px}
.btn{border:1px solid var(--line);background:transparent;color:var(--text);padding:7px 12px;border-radius:6px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,.x:focus-visible,.tab:focus-visible,.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.primary:hover{color:var(--accent-fg);filter:brightness(1.08)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer}
.tab[aria-current="true"]{background:var(--text);color:var(--bar);border-color:var(--text);font-weight:600}
.date-in{border:1px solid var(--line);background:transparent;color:var(--text);padding:6px 8px;border-radius:6px}
.hint{color:var(--muted);font-size:12.5px}
.toast{min-height:18px;color:var(--muted);font-size:13px}
.stage{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;display:flex;justify-content:center}
.sheet-wrap{flex:none}

/* The paper. Same in light and dark on purpose: it is what gets exported. */
.sheet{width:1123px;min-height:794px;background:var(--paper);color:var(--ink);border:5px double var(--ink);
  padding:52px 56px 36px;display:flex;flex-direction:column;gap:30px;font-family:var(--font);letter-spacing:0;
  box-shadow:0 6px 30px rgba(0,0,0,.18)}
.sheet .title{font-size:30px;font-weight:700;text-decoration:underline;text-underline-offset:6px;line-height:1.6;text-align:center}
.sheet table{width:100%;border-collapse:collapse;table-layout:auto}
.sheet th,.sheet td{border:1px solid var(--ink);text-align:center;vertical-align:middle;padding:6px 10px;font-size:var(--fs,20px);line-height:1.7;position:relative}
.sheet th{font-weight:500;padding-block:8px}
.sheet tr.dstart td{border-top-width:2px}
.sheet .daytd{font-size:calc(var(--fs,20px) + 1px);min-width:130px}
.sheet .dn{font-weight:500}
.sheet .foot{font-size:22px;font-weight:700;line-height:1.7;margin-top:auto;padding-top:14px}
.ce{outline:none;white-space:pre-wrap;word-break:break-word;min-height:1.7em;border-radius:3px}
.sheet td .ce:empty::before,.sheet th .ce:empty::before{content:"ـــــــــ";color:var(--rule-soft)}
.edit .ce:hover{background:rgba(31,78,140,.08)}
.edit .ce:focus{background:rgba(31,78,140,.14);box-shadow:0 0 0 2px var(--accent)}
.ctl{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.mini{border:1px solid #b9bfc8;background:#f3f4f6;color:#222;border-radius:4px;font-size:12px;padding:2px 7px;cursor:pointer}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.del:hover{border-color:var(--danger);color:var(--danger)}
.x{position:absolute;top:2px;left:2px;width:20px;height:20px;border:none;background:#e9eaee;color:#444;border-radius:50%;font-size:14px;line-height:1;cursor:pointer;opacity:.35}
th:hover .x,.x:focus-visible{opacity:1}
.x:hover{color:var(--danger)}
.addday{margin-top:-14px;align-self:flex-start}
.noexp{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.btn,.tab{transition:border-color .15s,color .15s}}
</style>

</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <header class="bar">
    <div class="row">
      <span class="brand">مخطط الأسبوع</span>
      <div class="tabs" id="tabs" role="tablist" aria-label="الصفحات"></div>
      <button class="btn" data-act="newPage" title="صفحة بنفس الشكل والخانات فاضية">+ صفحة جديدة</button>
      <button class="btn" data-act="dupPage" title="نسخة طبق الأصل من الصفحة الحالية">نسخ الصفحة</button>
      <button class="btn danger" data-act="delPage" id="delPage">حذف الصفحة</button>
    </div>
    <div class="row">
      <button class="btn" data-act="addCol">+ عمود</button>
      <button class="btn" data-act="fsMinus" aria-label="تصغير الخط">أ−</button>
      <button class="btn" data-act="fsPlus" aria-label="تكبير الخط">أ+</button>
      <span class="sep"></span>
      <label class="hint" for="start">أول يوم:</label>
      <input class="date-in" type="date" id="start">
      <button class="btn" data-act="autoDates" title="يكتب أسماء الأيام والتواريخ بالترتيب ويتخطى الجمعة والسبت">املأ الأيام والتواريخ</button>
      <span class="sep"></span>
      <button class="btn" data-act="undo" id="undoBtn" disabled>تراجع</button>
      <button class="btn primary" data-act="pdf" id="pdfBtn">تحميل PDF</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </header>
  <main class="stage" id="stage"><div class="sheet-wrap" id="wrap"><div id="sheetHost" class="edit"></div></div></main>
</div>

<script>
(function(){
const KEY="weekly-planner-v1";
const DAYS=["الاحد","الاثنين","الثلاثاء","الاربعاء","الخميس","الجمعة","السبت"];
const CE=(function(){var d=document.createElement("div");try{d.contentEditable="plaintext-only";}catch(e){}return d.contentEditable==="plaintext-only"?"plaintext-only":"true";})();

function mk(day,date,rows){return {day:day,date:date,rows:rows};}
function defaultPage(){
  return {
    title:"خطة مادة الرياضيات للصف الرابع الابتدائي من 4 / 10 إلى 8 / 10",
    dayHead:"اليوم | التاريخ",
    cols:["الفصول","كتاب","ملزمة","الكشكول","ملاحظات"],
    fs:20,
    days:[
      mk("الاحد","4 / 10",[["4 / 1","","","",""],["4 / 2","17 - 19","10","مفعل","مفعل"]]),
      mk("الاثنين","5 / 10",[["4 / 1","18 – 19","","",""],["4 / 2","","","مفعل","تقييم"]]),
      mk("الثلاثاء","6 / 10",[["4 / 1","","","",""],["4 / 2","","","",""]]),
      mk("الاربعاء","7 / 10",[["4 / 1","20-21-22","11-12-13","مفعل",""],["4 / 2","","","",""]]),
      mk("الخميس","8 / 10",[["4 / 1","","","","اجازة اكتوبر"],["4 / 2","","","",""]])
    ],
    foot:"مديرة المدرسة :-- أمال ثابت"
  };
}
function normalize(p){
  p.cols=p.cols||[]; p.days=p.days||[]; p.fs=p.fs||20;
  p.days.forEach(function(d){d.rows=d.rows&&d.rows.length?d.rows:[[]];d.rows.forEach(function(r){while(r.length<p.cols.length)r.push("");});});
  return p;
}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.pages&&s.pages.length){s.pages.forEach(normalize);s.cur=Math.min(s.cur||0,s.pages.length-1);return s;}}catch(e){}return null;}
var S=load()||{cur:0,pages:[defaultPage()]};
var undoStack=[];
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}},250);}
function snap(){undoStack.push(JSON.stringify(S));if(undoStack.length>30)undoStack.shift();updUndo();}
function updUndo(){document.getElementById("undoBtn").disabled=!undoStack.length;}
function cur(){return S.pages[S.cur];}
function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function sheetHTML(p,edit){
  function ce(k,txt,attrs,cls){return '<div class="ce '+(cls||"")+'" '+(edit?'contenteditable="'+CE+'" spellcheck="false" ':"")+'data-k="'+k+'" '+(attrs||"")+'>'+esc(txt)+'</div>';}
  var h='<div class="sheet" style="--fs:'+p.fs+'px">';
  h+=ce("title",p.title,"","title");
  h+='<table><thead><tr><th>'+ce("dayHead",p.dayHead)+'</th>';
  p.cols.forEach(function(c,i){
    h+='<th>'+ce("col",c,'data-c="'+i+'"')+(edit&&p.cols.length>1?'<button class="x" data-act="delCol" data-c="'+i+'" title="حذف العمود" aria-label="حذف العمود">×</button>':"")+'</th>';
  });
  h+='</tr></thead><tbody>';
  p.days.forEach(function(d,di){
    d.rows.forEach(function(r,ri){
      h+='<tr'+(ri===0?' class="dstart"':"")+'>';
      if(ri===0){
        h+='<td class="daytd" rowspan="'+d.rows.length+'">'+ce("day",d.day,'data-d="'+di+'"',"dn")+ce("date",d.date,'data-d="'+di+'"',"dd");
        if(edit)h+='<div class="ctl"><button class="mini" data-act="addRow" data-d="'+di+'" title="إضافة صف لليوم ده">+ صف</button>'+
          (d.rows.length>1?'<button class="mini" data-act="delRow" data-d="'+di+'" title="حذف آخر صف">− صف</button>':"")+
          '</div>';
        h+='</td>';
      }
      r.forEach(function(v,ci){h+='<td>'+ce("cell",v,'data-d="'+di+'" data-r="'+ri+'" data-c="'+ci+'"')+'</td>';});
      h+='</tr>';
    });
  });
  h+='</tbody></table>';
  h+=ce("foot",p.foot,"","foot");
  h+='</div>';
  return h;
}

var host=document.getElementById("sheetHost"),stage=document.getElementById("stage"),wrap=document.getElementById("wrap");
function renderSheet(){host.innerHTML=sheetHTML(cur(),true);fit();}
function renderBar(){
  var t=document.getElementById("tabs");
  t.innerHTML=S.pages.map(function(p,i){return '<button class="tab" role="tab" data-act="goto" data-i="'+i+'" aria-current="'+(i===S.cur)+'">صفحة '+(i+1)+'</button>';}).join("");
  document.getElementById("delPage").disabled=S.pages.length<2;
  document.getElementById("pdfBtn").textContent="تحميل PDF ("+S.pages.length+(S.pages.length===1?" صفحة":S.pages.length<=10?" صفحات":" صفحة")+")";
  updUndo();
}
function render(){renderBar();renderSheet();save();}
function fit(){var avail=stage.clientWidth-32;var z=Math.min(1,avail/1123);wrap.style.zoom=z>0?z:1;}
window.addEventListener("resize",fit);

var toastT;
function toast(m){var el=document.getElementById("toast");el.textContent=m;clearTimeout(toastT);toastT=setTimeout(function(){el.textContent="";},5000);}

/* typing */
host.addEventListener("input",function(e){
  var el=e.target.closest("[data-k]");if(!el)return;
  var txt=el.innerText.replace(/\n$/,"");
  if(txt.trim()===""){txt="";if(el.innerHTML!=="")el.innerHTML="";}
  var p=cur(),k=el.dataset.k,d=+el.dataset.d,r=+el.dataset.r,c=+el.dataset.c;
  if(k==="title")p.title=txt;else if(k==="foot")p.foot=txt;else if(k==="dayHead")p.dayHead=txt;
  else if(k==="col")p.cols[c]=txt;else if(k==="day")p.days[d].day=txt;else if(k==="date")p.days[d].date=txt;
  else if(k==="cell")p.days[d].rows[r][c]=txt;
  save();
});
host.addEventListener("paste",function(e){
  if(!e.target.closest("[data-k]"))return;
  e.preventDefault();
  var t=(e.clipboardData||window.clipboardData).getData("text/plain");
  document.execCommand("insertText",false,t);
});

/* actions */
function emptyRow(p){return p.cols.map(function(){return "";});}
var delArm=0;
var actions={
  goto:function(b){S.cur=+b.dataset.i;render();},
  newPage:function(){snap();var p=clone(cur());p.days.forEach(function(d){d.rows=d.rows.map(function(r){return r.map(function(){return "";});});});S.pages.splice(S.cur+1,0,p);S.cur++;render();toast("اتضافت صفحة جديدة بنفس الشكل. عدّل الأيام والتواريخ.");},
  dupPage:function(){snap();S.pages.splice(S.cur+1,0,clone(cur()));S.cur++;render();toast("اتعمل نسخة من الصفحة.");},
  delPage:function(b){
    if(S.pages.length<2)return;
    if(!delArm||Date.now()-delArm>3500){delArm=Date.now();b.textContent="اضغط تاني للتأكيد";setTimeout(function(){if(b.isConnected&&Date.now()-delArm>=3400)b.textContent="حذف الصفحة";},3600);return;}
    delArm=0;snap();S.pages.splice(S.cur,1);S.cur=Math.max(0,S.cur-1);render();toast("اتحذفت الصفحة. تقدر تدوس تراجع.");
  },
  addDay:function(){snap();var p=cur(),n=p.days.length?p.days[p.days.length-1].rows.length:1;var rows=[];for(var i=0;i<n;i++)rows.push(emptyRow(p));p.days.push(mk("","",rows));render();},
  delDay:function(b){snap();cur().days.splice(+b.dataset.d,1);render();},
  addRow:function(b){snap();var p=cur();p.days[+b.dataset.d].rows.push(emptyRow(p));render();},
  delRow:function(b){var d=cur().days[+b.dataset.d];if(d.rows.length<2)return;snap();d.rows.pop();render();},
  addCol:function(){snap();var p=cur();p.cols.push("عمود جديد");p.days.forEach(function(d){d.rows.forEach(function(r){r.push("");});});render();},
  delCol:function(b){var p=cur();if(p.cols.length<2)return;snap();var c=+b.dataset.c;p.cols.splice(c,1);p.days.forEach(function(d){d.rows.forEach(function(r){r.splice(c,1);});});render();},
  fsPlus:function(){var p=cur();if(p.fs<30){p.fs+=1;render();}},
  fsMinus:function(){var p=cur();if(p.fs>12){p.fs-=1;render();}},
  autoDates:function(){
    var v=document.getElementById("start").value;if(!v){toast("اختار أول يوم من الخانة الأول.");return;}
    var parts=v.split("-"),dt=new Date(+parts[0],+parts[1]-1,+parts[2]);snap();
    cur().days.forEach(function(d){
      while(dt.getDay()===5||dt.getDay()===6)dt.setDate(dt.getDate()+1);
      d.day=DAYS[dt.getDay()];d.date=dt.getDate()+" / "+(dt.getMonth()+1);
      dt.setDate(dt.getDate()+1);
    });
    render();toast("اتملت الأيام والتواريخ. العنوان لسه زي ما هو، عدّله لو محتاج.");
  },
  undo:function(){if(!undoStack.length)return;S=JSON.parse(undoStack.pop());S.pages.forEach(normalize);S.cur=Math.min(S.cur,S.pages.length-1);render();},
  pdf:exportPdf
};
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=actions[b.dataset.act];if(a)a(b);
});

/* PDF: each page is drawn at A4-landscape size, photographed, then placed on its own PDF page */
var busy=false;
async function exportPdf(){
  if(busy)return;
  var dl=null;try{dl=await claude.use("downloads");}catch(e){}
  if(!window.html2canvas||!window.jspdf){toast("مكتبة الـ PDF لسه بتتحمل، جرب بعد ثواني.");return;}
  busy=true;var btn=document.getElementById("pdfBtn");btn.disabled=true;
  var stash=document.createElement("div");
  stash.style.cssText="position:fixed;left:-20000px;top:0;direction:rtl;";
  stash.setAttribute("dir","rtl");stash.setAttribute("lang","ar");
  document.body.appendChild(stash);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    var doc=new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
    var W=297,H=210,M=5;
    for(var i=0;i<S.pages.length;i++){
      btn.textContent="جارٍ التجهيز "+(i+1)+" / "+S.pages.length;
      stash.innerHTML=sheetHTML(S.pages[i],false);
      var node=stash.firstChild;
      var cv=await window.html2canvas(node,{scale:2,backgroundColor:"#ffffff",logging:false});
      var r=Math.min((W-2*M)/cv.width,(H-2*M)/cv.height);
      var w=cv.width*r,h=cv.height*r;
      if(i>0)doc.addPage("a4","landscape");
      doc.addImage(cv.toDataURL("image/png"),"PNG",(W-w)/2,(H-h)/2,w,h,undefined,"FAST");
    }
    var blob=doc.output("blob");
    if(dl){
      var res=await dl.save({filename:"خطة-الاسبوع.pdf",data:blob});
      toast(res&&res.status==="saved"?"اتحفظ ملف الـ PDF.":"اتبعت الملف.");
    }else{
      var url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download="خطة-الاسبوع.pdf";document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},4000);
      toast("اتنزل ملف الـ PDF.");
    }
  }catch(err){
    if(err&&err.code==="declined")toast("اتلغى التحميل.");
    else toast("حصلت مشكلة وإحنا بنجهز الـ PDF"+(err&&err.message?": "+err.message:"."));
  }finally{
    stash.remove();busy=false;btn.disabled=false;renderBar();
  }
}

(function(){var d=new Date();var el=document.getElementById("start");try{el.value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}catch(e){}})();
render();
})();
</script>

</body>
</html>
